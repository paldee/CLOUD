<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriChain - เข้าสู่ระบบ</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@600;700&family=Work+Sans:wght@400;500&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            background: #EDE8DC;
            color: #1D1C14;
            font-family: 'Work Sans', sans-serif;
        }

        .login-page {
            min-height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: row;
            align-items: stretch;
            overflow: hidden;
            background: #EDE8DC;
        }

        .brand-section {
            width: 58.3333%;
            min-height: 100vh;
            position: relative;
            overflow: hidden;
            background: #D7E5B6;
            padding: 0;
        }

        .brand-content {
            position: relative;
            width: 100%;
            height: 100vh;
        }

        .brand-name {
            position: absolute;
            left: 24px;
            top: 24px;
            height: 32px;
            display: flex;
            align-items: center;
            gap: 4px;
            color: #805532;
        }

        .brand-logo {
            width: 22.72px;
            height: 22.7px;
            color: #546341;
        }

        .brand-name span {
            font-family: 'Manrope', sans-serif;
            font-size: 24px;
            line-height: 32px;
            font-weight: 700;
            color: #805532;
        }

        .hero-visual {
            position: absolute;
            left: 24px;
            right: 24px;
            top: 56px;
            bottom: 156px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .illustration-frame {
            width: min(610px, 100%);
            height: min(610px, 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            background: transparent;
            overflow: hidden;
            mix-blend-mode: normal;
            opacity: 1;
        }

        .illustration-frame img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .hero-copy {
            position: absolute;
            left: 24px;
            bottom: 24px;
            width: min(448px, calc(100% - 48px));
            padding: 0;
        }

        .hero-copy h1 {
            width: 100%;
            font-family: 'Manrope', sans-serif;
            font-size: 32px;
            line-height: 40px;
            font-weight: 600;
            color: #5B6741;
            margin: 0 0 4px;
        }

        .hero-copy p {
            width: 100%;
            font-family: 'Work Sans', sans-serif;
            font-size: 16px;
            line-height: 24px;
            font-weight: 400;
            color: #57633D;
            margin: 0;
        }

        .copyright {
            display: none;
        }

        .form-section {
            width: 41.6667%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            background: #F8F3E7;
        }

        .login-card {
            box-sizing: border-box;
            width: 448px;
            max-width: 100%;
            /* min-height: 495px; */
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 24px;
            background: rgba(215, 229, 182, .2);
            border: 1px solid rgba(197, 200, 188, .1);
            box-shadow: 0 4px 20px rgba(97, 58, 26, .1);
            backdrop-filter: blur(2px);
            border-radius: 12px;
        }

        .login-header {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-top: 10px;
        }

        .login-header h2 {
            width: 100%;
            font-family: 'Loma', Tahoma, sans-serif;
            font-size: 32px;
            line-height: 40px;
            font-weight: 600;
            color: #1D1C14;
        }

        .login-header p {
            width: 100%;
            font-family: 'Loma', Tahoma, sans-serif;
            font-size: 16px;
            line-height: 24px;
            font-weight: 400;
            color: #45483F;
        }

        #loginForm {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .form-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .form-group>div:first-child {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .form-group label {
            font-family: 'Loma', Tahoma, sans-serif;
            font-size: 14px;
            line-height: 20px;
            font-weight: 600;
            letter-spacing: .14px;
            color: #805532;
        }

        .forgot-link {
            font-family: 'Loma', Tahoma, sans-serif;
            font-size: 12px;
            line-height: 16px;
            font-weight: 600;
            color: #546341;
            cursor: pointer;
        }

        .input-wrapper {
            position: relative;
            width: 100%;
            height: 50px;
        }

        .input-wrapper input {
            width: 100%;
            height: 50px;
            padding: 14px 48px 14px 40px;
            border: 1px solid #6B7280;
            border-radius: 8px;
            background: #FFFFFF;
            color: #1D1C14;
            outline: none;
            font-family: 'Work Sans', sans-serif;
            font-size: 16px;
            line-height: 19px;
        }

        .input-wrapper input::placeholder {
            color: #C5C8BC;
            opacity: 1;
        }

        .input-wrapper input:focus {
            border-color: #805532;
            box-shadow: 0 0 0 2px rgba(128, 85, 50, .08);
        }

        .input-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #75786E;
            pointer-events: none;
            font-size: 16px;
            z-index: 1;
        }

        .toggle-password {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            width: 32px;
            height: 32px;
            padding: 0;
            border: 0;
            background: transparent;
            color: #75786E;
            cursor: pointer;
        }

        .eye-icon {
            width: 22px;
            height: 15px;
            display: block;
        }

        .eye-on {
            display: none;
        }

        .remember-row {
            width: 100%;
            min-height: 40px;
            padding: 4px 0 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .remember-row input {
            width: 16px;
            height: 16px;
            accent-color: #805532;
        }

        .remember-row span {
            font-family: 'Loma', Tahoma, sans-serif;
            font-size: 16px;
            line-height: 24px;
            color: #45483F;
        }

        .login-button {
            width: 100%;
            height: 56px;
            padding: 12px 0;
            border: 0;
            border-radius: 8px;
            background: #A5B68D;
            box-shadow: 0 1px 2px rgba(0, 0, 0, .05);
            color: #2F1400;
            font-family: 'Loma', Tahoma, sans-serif;
            font-size: 18px;
            line-height: 32px;
            font-weight: 600;
            cursor: pointer;
        }

        .login-button:hover {
            background: #96A77E;
        }

        #loginMessage {
            width: 100%;
            text-align: center;
            font-family: 'Loma', Tahoma, sans-serif;
            font-size: 14px !important;
            min-height: 16px;
        }

        .request-access {
            box-sizing: border-box;
            width: 100%;
            padding: 12px 0 0;
            border-top: 1px solid rgba(128, 85, 50, .1);
            text-align: center;
            font-family: 'Loma', Tahoma, sans-serif;
            font-size: 16px;
            line-height: 24px;
            color: #45483F;
        }

        .request-access a {
            color: #546341;
            font-weight: 600;
            text-decoration: none;
        }

        .request-access a:hover {
            text-decoration: underline;
        }

        .language-switch {
            position: fixed;
            right: 24px;
            top: 20px;
            z-index: 20;
            display: flex;
            gap: 2px;
            padding: 3px;
            background: #F8F3E7;
            border: 1px solid rgba(128, 85, 50, .12);
            border-radius: 20px;
            box-shadow: 0 2px 8px rgba(97, 58, 26, .08);
        }

        .language-switch button {
            border: 0;
            background: transparent;
            padding: 5px 10px;
            border-radius: 16px;
            cursor: pointer;
            color: #546341;
            font-size: 13px;
        }

        .language-switch .active {
            background: #D7E5B6;
            color: #805532;
            font-weight: 700;
        }

        @media (max-width: 900px) {
            .brand-section {
                width: 52%;
            }

            .form-section {
                width: 48%;
                padding: 18px;
            }

            .login-card {
                padding: 20px;
            }

            .hero-copy h1 {
                font-size: 26px;
                line-height: 34px;
            }

            .hero-copy p {
                font-size: 14px;
                line-height: 21px;
            }
        }

        @media (max-width: 700px) {
            .login-page {
                display: block;
                overflow: auto;
            }

            .brand-section {
                display: none;
            }

            .form-section {
                width: 100%;
                min-height: 100vh;
                padding: 72px 16px 24px;
            }

            .login-card {
                width: 448px;
            }

            .language-switch {
                right: 14px;
                top: 14px;
            }
        }
    </style>
</head>

<body>
    <div class="language-switch"><button id="thBtn" class="active">ไทย</button><button id="enBtn">EN</button></div>
    <main class="login-page">
        <section class="brand-section">
            <div class="brand-content">
                <div class="brand-name"><svg class="brand-logo" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="1.8">
                        <path d="M21 4C12 4 5 8 3 20c8-1 15-6 18-16Z" />
                        <path d="M4 19c4-5 8-8 14-11" />
                    </svg><span>AgriChain</span></div>
            </div>
            <div class="hero-visual">
                <div class="illustration-frame">
                    <img src="front.png" alt="AgriChain agricultural supply chain illustration">
                </div>
            </div>
            <div class="hero-copy">
                <h1 data-i18n="brandTitle">ขับเคลื่อนข้อมูลอัจฉริยะ<br>สู่ห่วงโซ่อุปทานการเกษตร</h1>
                <p data-i18n="brandDesc">จัดการการดำเนินงาน เพิ่มการมองเห็นข้อมูล
                    และยกระดับประสิทธิภาพของเครือข่ายโลจิสติกส์การเกษตรแบบครบวงจร</p>
            </div>
            <div class="copyright">© 2026 AgriChain Logistics Systems.</div>
            </div>
        </section>
        <section class="form-section">
            <div class="login-card">
                <div class="login-header">
                    <h2 data-i18n="welcome">ยินดีต้อนรับเข้าสู่ระบบ</h2>
                    <p data-i18n="subtitle">กรุณากรอกข้อมูลเพื่อเข้าสู่ระบบ</p>
                </div>
                <form id="loginForm" autocomplete="on">
                    <div class="form-group"><label for="email" data-i18n="email">อีเมล</label>
                        <div class="input-wrapper"><span class="input-icon">✉</span><input type="text" id="email"
                                name="email" placeholder="exec01 / analyst01 / admin01" autocomplete="username" required></div>
                    </div>
                    <div class="form-group">
                        <div style="display:flex;justify-content:space-between;align-items:center"><label for="password"
                                data-i18n="password">รหัสผ่าน</label><span style="font-size:.58rem;color:#8b8e80"
                                class="forgot-link" data-i18n="forgot">ลืมรหัสผ่าน?</span></div>
                        <div class="input-wrapper"><span class="input-icon">🔒︎</span><input type="password"
                                id="password" placeholder="" autocomplete="current-password" value="" required><button
                                type="button" class="toggle-password" id="togglePassword" aria-label="แสดงรหัสผ่าน"><svg
                                    class="eye-icon eye-off" viewBox="0 0 24 24" fill="none">
                                    <path
                                        d="M3 3l18 18M10.6 10.6a2 2 0 102.8 2.8M9.9 5.7A9.7 9.7 0 0112 5.5c4 0 7.3 2.3 9.5 6.5a13 13 0 01-3 3.7M6.2 6.2C4.6 7.5 3.3 9.3 2.5 12c2.2 4.2 5.5 6.5 9.5 6.5 1.3 0 2.5-.2 3.6-.7"
                                        stroke="currentColor" stroke-width="1.7" />
                                </svg><svg class="eye-icon eye-on" viewBox="0 0 24 24" fill="none">
                                    <path
                                        d="M2.5 12C4.7 7.8 8 5.5 12 5.5c4 0 7.3 2.3 9.5 6.5-2.2 4.2-5.5 6.5-9.5 6.5S4.7 16.2 2.5 12z"
                                        stroke="currentColor" stroke-width="1.7" />
                                    <circle cx="12" cy="12" r="2.8" stroke="currentColor" stroke-width="1.7" />
                                </svg></button></div>
                    </div>
                    <label class="remember-row"><input type="checkbox"> <span
                            data-i18n="remember">จดจำการเข้าสู่ระบบ</span></label>
                    <button type="submit" class="login-button" data-i18n="login">เข้าสู่ระบบ →</button>
                    <div id="loginMessage" style="text-align:center;font-size:.7rem;font-weight:600;min-height:16px">
                    </div>
                </form>
        </section>
    </main>
    <script src="login.js"></script>
</body>

</html>
